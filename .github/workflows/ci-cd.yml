name: CI/CD — portfolio-v2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PROJECT_NAME: portfolio-v2
  SITE_URL: https://ryuda.me
  DEPLOY_DIR: /opt/portfolio-v2/app

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Build Docker image
        run: docker build -t ${{ env.PROJECT_NAME }}:latest .

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env.production
        run: |
          echo "NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}" > .env.production
          echo "NODE_ENV=production" >> .env.production
          echo "NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.UMAMI_WEBSITE_ID }}" >> .env.production
          echo "NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ secrets.UMAMI_SCRIPT_URL }}" >> .env.production

      - name: Make deploy script executable
        run: chmod +x scripts/deploy.sh

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM
        env:
          HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'sp-deploy' }}
        run: |
          scp .env.production "$DEPLOY_USER@$HOST:${{ env.DEPLOY_DIR }}"
          scp scripts/deploy.sh "$DEPLOY_USER@$HOST:${{ env.DEPLOY_DIR }}"

          ssh "$DEPLOY_USER@$HOST" << EOF
            cd "${{ env.DEPLOY_DIR }}"
            ./deploy.sh
          EOF
